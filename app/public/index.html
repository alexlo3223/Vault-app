<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Vault</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffc857' stroke-width='2' stroke-linecap='round'%3E%3Ccircle cx='12' cy='6' r='2.5'/%3E%3Ccircle cx='6' cy='17' r='2.5'/%3E%3Ccircle cx='18' cy='17' r='2.5'/%3E%3Cpath d='M10.8 8.2 7.2 14.8M13.2 8.2l3.6 6.6M8.5 17h7'/%3E%3C/svg%3E" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0b0f" />
    <link rel="preload" href="/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <aside id="sidebar" aria-label="Barra lateral">
      <div class="brand">
        <span class="logo" data-icon="hub" data-size="20"></span>
        <span class="brand-name">Vault</span>
      </div>
      <nav class="nav" aria-label="Vistas">
        <a id="nav-overview" class="nav-item" href="#overview"><span data-icon="overview" data-size="18"></span><span>Resumen</span></a>
        <a id="nav-graph" class="nav-item" href="#graph"><span data-icon="graph" data-size="18"></span><span>Grafo</span></a>
        <button id="open-search" class="nav-item" type="button"><span data-icon="search" data-size="18"></span><span>Buscar</span><kbd class="kbd"></kbd></button>
        <button id="open-settings" class="nav-item" type="button" hidden><span data-icon="settings" data-size="18"></span><span>Ajustes</span></button>
      </nav>
      <div class="side-scroll">
        <div id="pages-head" class="side-head" title="Suelta aquí para mover a la raíz">
          <span class="eyebrow mono">Páginas</span>
          <span class="side-actions">
            <button id="new-folder" class="icon-btn" type="button" aria-label="Carpeta nueva" title="Carpeta nueva" data-icon="folder" data-size="15"></button>
            <button id="new-page" class="icon-btn" type="button" aria-label="Página nueva" title="Página nueva" data-icon="plus" data-size="15"></button>
          </span>
        </div>
        <nav aria-label="Árbol de páginas"><ul id="tree" class="tree"></ul></nav>
        <div class="side-head"><span class="eyebrow mono">Etiquetas</span></div>
        <div id="tags" class="tags"></div>
      </div>
      <footer class="side-foot mono"><span class="dot"></span><span id="vault-stats">Vault local</span></footer>
    </aside>

    <div class="shell">
      <header class="topbar">
        <button id="toggle-sidebar" class="icon-btn" type="button" aria-label="Mostrar u ocultar la barra lateral" data-icon="sidebar" data-size="18"></button>
        <nav id="crumbs" class="crumbs mono" aria-label="Ruta"></nav>
        <button id="top-search" class="search-pill" type="button">
          <span data-icon="search" data-size="15"></span>
          <span class="search-hint">Busca notas, etiquetas o consultas…</span>
          <kbd class="kbd"></kbd>
        </button>
        <span id="status" class="status mono" aria-live="polite"></span>
        <button id="new-note" class="btn primary" type="button"><span data-icon="plus" data-size="16"></span><span>Nota nueva</span></button>
      </header>

      <main>
        <div id="conflict" class="banner" role="alert" hidden>
          <span>Esta página cambió fuera de la app, así que tus últimos cambios no se han guardado.</span>
          <button id="reload-disk" class="btn" type="button">Cargar la versión del disco</button>
          <button id="keep-mine" class="btn" type="button">Conservar mi versión</button>
        </div>
        <div id="notice" class="notice" role="status" hidden></div>

        <section id="view-overview" class="view" aria-label="Resumen"></section>
        <section id="view-graph" class="view graph-host" aria-label="Grafo" hidden></section>

        <section id="view-page" class="view" hidden>
          <div class="page-layout">
            <article id="page" class="page">
              <div id="cover" class="page-cover" hidden></div>
              <div id="page-icon" class="page-icon" aria-hidden="true" hidden></div>
              <h1 id="title" class="title" data-placeholder="Sin título" spellcheck="false"></h1>
              <p id="meta" class="meta mono"></p>
              <section id="props" class="glass props" aria-label="Propiedades" hidden></section>
              <div id="blocks" class="blocks"></div>
              <div id="blocks-end" class="blocks-end" aria-hidden="true"></div>
              <section id="related" class="related" aria-label="Notas relacionadas" hidden></section>
            </article>

          </div>
        </section>
      </main>
    </div>

    <div id="menu" class="menu glass" role="listbox" hidden></div>

    <dialog id="switcher" aria-label="Buscar páginas">
      <div class="sw-input">
        <span data-icon="search" data-size="18"></span>
        <input id="q" type="search" autocomplete="off" placeholder='Buscar páginas… prueba tag:trabajo, "frase exacta", -palabra' aria-label="Buscar páginas" />
        <kbd class="kbd">esc</kbd>
      </div>
      <ul id="results" role="listbox"></ul>
      <footer class="sw-foot mono"><span>↑↓ moverse</span><span>↵ abrir</span><span>tag: path: file: line: block: section:</span></footer>
    </dialog>

    <!-- Text prompt used instead of window.prompt(), which Electron does not support. -->
    <dialog id="ask" aria-labelledby="ask-title">
      <form id="ask-form" method="dialog">
        <h2 id="ask-title" class="ask-title"></h2>
        <input id="ask-input" type="text" autocomplete="off" aria-label="Valor" />
        <div class="ask-actions">
          <button type="button" id="ask-cancel" class="db-tab">Cancelar</button>
          <button type="submit" id="ask-ok" class="db-tab db-done">Aceptar</button>
        </div>
      </form>
    </dialog>
    <dialog id="settings" aria-labelledby="settings-title">
      <div class="settings-body">
        <h2 id="settings-title" class="ask-title">Ajustes</h2>
        <h3 class="eyebrow mono">Nube</h3>
        <p id="settings-cloud" class="settings-text"></p>
        <div id="settings-actions" class="ask-actions"></div>
        <p id="settings-msg" class="settings-text" aria-live="polite"></p>
        <div class="ask-actions"><button type="button" id="settings-close" class="db-tab">Cerrar</button></div>
      </div>
    </dialog>
  </body>
</html>
