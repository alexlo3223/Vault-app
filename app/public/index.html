<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Vault</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffc857' stroke-width='2' stroke-linecap='round'%3E%3Ccircle cx='12' cy='6' r='2.5'/%3E%3Ccircle cx='6' cy='17' r='2.5'/%3E%3Ccircle cx='18' cy='17' r='2.5'/%3E%3Cpath d='M10.8 8.2 7.2 14.8M13.2 8.2l3.6 6.6M8.5 17h7'/%3E%3C/svg%3E" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0b0f" />
    <link rel="preload" href="/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <aside id="sidebar" aria-label="Sidebar">
      <div class="brand">
        <span class="logo" data-icon="hub" data-size="20"></span>
        <span class="brand-name">Vault</span>
      </div>
      <nav class="nav" aria-label="Views">
        <a id="nav-overview" class="nav-item" href="#overview"><span data-icon="overview" data-size="18"></span><span>Overview</span></a>
        <a id="nav-graph" class="nav-item" href="#graph"><span data-icon="graph" data-size="18"></span><span>Graph view</span></a>
        <button id="open-search" class="nav-item" type="button"><span data-icon="search" data-size="18"></span><span>Search</span><kbd class="kbd"></kbd></button>
      </nav>
      <div class="side-scroll">
        <div id="pages-head" class="side-head" title="Drop here to move to the top level">
          <span class="eyebrow mono">Pages</span>
          <span class="side-actions">
            <button id="new-folder" class="icon-btn" type="button" aria-label="New folder" title="New folder" data-icon="folder" data-size="15"></button>
            <button id="new-page" class="icon-btn" type="button" aria-label="New page" title="New page" data-icon="plus" data-size="15"></button>
          </span>
        </div>
        <nav aria-label="Page tree"><ul id="tree" class="tree"></ul></nav>
        <div class="side-head"><span class="eyebrow mono">Tags</span></div>
        <div id="tags" class="tags"></div>
      </div>
      <footer class="side-foot mono"><span class="dot"></span><span id="vault-stats">Local vault</span></footer>
    </aside>

    <div class="shell">
      <header class="topbar">
        <button id="toggle-sidebar" class="icon-btn" type="button" aria-label="Toggle sidebar" data-icon="sidebar" data-size="18"></button>
        <nav id="crumbs" class="crumbs mono" aria-label="Breadcrumb"></nav>
        <button id="top-search" class="search-pill" type="button">
          <span data-icon="search" data-size="15"></span>
          <span class="search-hint">Search notes, tags or queries…</span>
          <kbd class="kbd"></kbd>
        </button>
        <span id="status" class="status mono" aria-live="polite"></span>
        <button id="new-note" class="btn primary" type="button"><span data-icon="plus" data-size="16"></span><span>New note</span></button>
      </header>

      <main>
        <div id="conflict" class="banner" role="alert" hidden>
          <span>This page was changed outside the app, so your latest edits were not saved.</span>
          <button id="reload-disk" class="btn" type="button">Load the version on disk</button>
          <button id="keep-mine" class="btn" type="button">Keep my version</button>
        </div>
        <div id="notice" class="notice" role="status" hidden></div>

        <section id="view-overview" class="view" aria-label="Overview"></section>
        <section id="view-graph" class="view graph-host" aria-label="Graph view" hidden></section>

        <section id="view-page" class="view" hidden>
          <div class="page-layout">
            <article id="page" class="page">
              <div id="cover" class="page-cover" hidden></div>
              <div id="page-icon" class="page-icon" aria-hidden="true" hidden></div>
              <h1 id="title" class="title" data-placeholder="Untitled" spellcheck="false"></h1>
              <p id="meta" class="meta mono"></p>
              <section id="props" class="glass props" aria-label="Properties" hidden></section>
              <div id="blocks" class="blocks"></div>
              <div id="blocks-end" class="blocks-end" aria-hidden="true"></div>
            </article>

          </div>
        </section>
      </main>
    </div>

    <div id="menu" class="menu glass" role="listbox" hidden></div>

    <dialog id="switcher" aria-label="Search pages">
      <div class="sw-input">
        <span data-icon="search" data-size="18"></span>
        <input id="q" type="search" autocomplete="off" placeholder='Search pages… try tag:work, "exact phrase", -word' aria-label="Search pages" />
        <kbd class="kbd">esc</kbd>
      </div>
      <ul id="results" role="listbox"></ul>
      <footer class="sw-foot mono"><span>↑↓ navigate</span><span>↵ open</span><span>tag: path: file: line: block: section:</span></footer>
    </dialog>
  </body>
</html>
